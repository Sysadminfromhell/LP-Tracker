when:
  - event: pull_request
  - event: push
    branch:
      include:
        - main
        - staging
        - release/*
  - event: manual
    branch:
      include:
        - main
        - staging
        - release/*

steps:
  - name: backend-tests
    image: node:26-alpine
    commands:
      - npm ci --prefix backend
      - npm --prefix backend run test
      - npm --prefix backend run typecheck
      - npm --prefix backend run build