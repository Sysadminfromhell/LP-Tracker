when:
  - event: push
    branch:
      include:
        - main
        - staging
        - release/*
  - event: manual
    branch:
      include:
        - main
        - staging
        - release/*
  - event: cron
    branch: staging
    cron: Daily
  - event: tag
    ref: refs/tags/v*

steps:
  - name: docker-build-next
    image: woodpeckerci/plugin-docker-buildx:latest
    privileged: true
    settings:
      registry: https://index.docker.io/v1/
      repo: safhdev/lp-tracker
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      dockerfile: Dockerfile.frontend
      context: .
      platforms:
        - linux/amd64
      tags:
        - frontend-next
        - frontend-next-${CI_COMMIT_SHA:0:8}-${CI_PIPELINE_NUMBER}
      pull_image: true
      provenance: mode=max
      sbom: true
      cache_images:
        - safhdev/lp-tracker:frontend-next-cache
      buildkit_oci_max_parallelism: 2
      buildkit_debug: true
      labels:
        - org.opencontainers.image.source=${CI_REPO_URL}
        - org.opencontainers.image.revision=${CI_COMMIT_SHA}
        - org.opencontainers.image.version=next-${CI_PIPELINE_NUMBER}
    when:
      - event: cron
        branch: staging
        cron: Daily

  - name: docker-build-staging
    image: woodpeckerci/plugin-docker-buildx:latest
    privileged: true
    settings:
      registry: https://index.docker.io/v1/
      repo: safhdev/lp-tracker
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      dockerfile: Dockerfile.frontend
      context: .
      platforms:
        - linux/amd64
      tags:
        - frontend-staging
        - frontend-staging-${CI_COMMIT_SHA:0:8}
      pull_image: true
      provenance: mode=max
      sbom: true
      cache_images:
        - safhdev/lp-tracker:frontend-cache
      buildkit_oci_max_parallelism: 2
      buildkit_debug: true
      labels:
        - org.opencontainers.image.source=${CI_REPO_URL}
        - org.opencontainers.image.revision=${CI_COMMIT_SHA}
        - org.opencontainers.image.version=staging-${CI_PIPELINE_NUMBER}
    when:
      - event: [push, manual]
        branch: staging

  - name: docker-build-release-candidate
    image: woodpeckerci/plugin-docker-buildx:latest
    privileged: true
    settings:
      registry: https://index.docker.io/v1/
      repo: safhdev/lp-tracker
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      dockerfile: Dockerfile.frontend
      context: .
      platforms:
        - linux/amd64
      tags:
        - frontend-${CI_COMMIT_BRANCH##release/}-rc
        - frontend-${CI_COMMIT_BRANCH##release/}-rc-${CI_COMMIT_SHA:0:8}
      pull_image: true
      provenance: mode=max
      sbom: true
      cache_images:
        - safhdev/lp-tracker:frontend-cache
      buildkit_oci_max_parallelism: 2
      buildkit_debug: true
      labels:
        - org.opencontainers.image.source=${CI_REPO_URL}
        - org.opencontainers.image.revision=${CI_COMMIT_SHA}
        - org.opencontainers.image.version=${CI_COMMIT_BRANCH##release/}-rc
    when:
      - event: [push, manual]
        branch: release/*

  - name: docker-build-main
    image: woodpeckerci/plugin-docker-buildx:latest
    privileged: true
    settings:
      registry: https://index.docker.io/v1/
      repo: safhdev/lp-tracker
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      dockerfile: Dockerfile.frontend
      context: .
      platforms:
        - linux/amd64
      tags:
        - frontend-main
        - frontend-main-${CI_COMMIT_SHA:0:8}
      pull_image: true
      provenance: mode=max
      sbom: true
      cache_images:
        - safhdev/lp-tracker:frontend-cache
      buildkit_oci_max_parallelism: 2
      buildkit_debug: true
      labels:
        - org.opencontainers.image.source=${CI_REPO_URL}
        - org.opencontainers.image.revision=${CI_COMMIT_SHA}
        - org.opencontainers.image.version=main-${CI_PIPELINE_NUMBER}
    when:
      - event: [push, manual]
        branch: main

  - name: docker-build-release
    image: woodpeckerci/plugin-docker-buildx:latest
    privileged: true
    settings:
      registry: https://index.docker.io/v1/
      repo: safhdev/lp-tracker
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      dockerfile: Dockerfile.frontend
      context: .
      platforms:
        - linux/amd64
      tags:
        - frontend
        - frontend-${CI_COMMIT_TAG##v}
      pull_image: true
      provenance: mode=max
      sbom: true
      cache_images:
        - safhdev/lp-tracker:frontend-cache
      buildkit_oci_max_parallelism: 2
      buildkit_debug: true
      labels:
        - org.opencontainers.image.source=${CI_REPO_URL}
        - org.opencontainers.image.revision=${CI_COMMIT_SHA}
        - org.opencontainers.image.version=${CI_COMMIT_TAG##v}
    when:
      - event: tag
        ref: refs/tags/v*