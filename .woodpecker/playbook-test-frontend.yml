when:
  - event: pull_request
  - event: push
    branch:
     include:
        - main
        - staging
        - release/*
  - event: manual

steps:
  - name: frontend-checks
    image: node:26-alpine
    commands:
      - npm ci --prefix frontend
      - npm --prefix frontend run test
      - npm --prefix frontend run build
      - npm --prefix frontend run lint
