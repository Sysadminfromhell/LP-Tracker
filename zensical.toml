
[project]
site_name = "LP-Tracker"
site_description = "Documentation for LP-Tracker"
site_url = "https://sysadminfromhell.github.io/LP-Tracker/"
repo_url = "https://github.com/Sysadminfromhell/LP-Tracker"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    { "Installation" = "getting-started/installation.md" }
  ] }
]

[project.theme]
language = "en"
features = [
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
  "content.action.edit"
]

[[project.theme.palette]]
scheme = "slate"
primary = "blue grey"
accent = "deep purple"
