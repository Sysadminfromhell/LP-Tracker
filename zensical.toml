[project]
site_name = "LP-Tracker"
site_description = "Official documentation for LP-Tracker"
site_url = "https://sysadminfromhell.github.io/LP-Tracker/"
repo_url = "https://github.com/Sysadminfromhell/LP-Tracker"
edit_uri = "edit/main/docs/"
strict = true

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    { "Installation" = "getting-started/installation.md" },
    { "Configuration" = "getting-started/configuration.md" }
  ] },
  { "User Guide" = [
    { "Leaderboard" = "user-guide/leaderboard.md" },
    { "Player & Event History" = "user-guide/history.md" },
    { "OBS Overlays" = "user-guide/overlays.md" }
  ] },
  { "Administration" = [
    { "Admin Overview" = "administration/overview.md" },
    { "Event Management" = "administration/events.md" },
    { "Privacy & Legal Pages" = "administration/legal.md" }
  ] },
  { "Event System" = [
    { "Lifecycle" = "event-system/lifecycle.md" },
    { "LP Scoring" = "event-system/scoring.md" },
    { "Refresh & Reconciliation" = "event-system/reconciliation.md" }
  ] },
  { "Development" = [
    { "Architecture" = "development/architecture.md" },
    { "Local Development" = "development/local-development.md" },
    { "REST API & Live Updates" = "development/api.md" }
  ] },
  { "Operations" = [
    { "Deployment" = "operations/deployment.md" },
    { "League Data Providers" = "operations/providers.md" },
    { "Monitoring" = "operations/monitoring.md" },
    { "Diagnostics CLI" = "operations/diagnostics.md" },
    { "Troubleshooting" = "operations/troubleshooting.md" }
  ] },
  { "Project" = [
    { "Roadmap" = "project/roadmap.md" },
    { "Contributing & Security" = "project/contributing.md" }
  ] }
]

[project.theme]
language = "en"
features = [
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "content.action.edit"
]

[[project.theme.palette]]
scheme = "slate"
primary = "blue grey"
accent = "deep purple"
